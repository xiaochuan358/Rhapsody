<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自动节拍器</title>
  <meta name="description" content="放入一首歌，自动识别 BPM 和拍号，并跟着音乐打拍子。完全在浏览器本地运行。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>自动节拍器</h1>
      <p class="sub">放入一首歌，自动识别速度和拍号，跟着音乐打拍子</p>
    </header>

    <!-- 选择文件 -->
    <label id="drop" class="drop">
      <input id="file" type="file" accept="audio/*,.mp3,.wav,.flac,.ogg,.m4a,.aac" hidden>
      <span class="drop-icon" aria-hidden="true">♪</span>
      <span class="drop-main">把音乐文件拖到这里，或点击选择</span>
      <span class="drop-hint">支持 MP3 / WAV / FLAC / OGG / M4A，文件只在本机处理，不会上传</span>
    </label>

    <p id="status" class="status" role="status" hidden></p>

    <!-- 播放器 -->
    <section id="player" class="player empty" aria-labelledby="autoTitle">
      <h2 id="autoTitle" class="section-title">自动识别</h2>
      <div class="song" id="songName">还没有放入歌曲</div>

      <div class="readout">
        <div class="stat">
          <div class="stat-value" id="bpm">--</div>
          <div class="stat-label">BPM</div>
        </div>
        <div class="pulse-wrap">
          <div class="pulse" id="pulse"><span id="beatNum">1</span></div>
          <div class="dots" id="dots"></div>
        </div>
        <div class="stat">
          <div class="stat-value" id="meter">4/4</div>
          <div class="stat-label">拍号</div>
        </div>
      </div>

      <div class="wave-wrap">
        <canvas id="wave" class="wave" height="120" aria-label="波形与进度条，点击跳转"></canvas>
        <div class="wave-empty" id="waveEmpty">把音乐拖进上面的框里，这里会显示波形和进度条，并标出每一拍</div>
      </div>
      <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>

      <div class="transport">
        <button id="play" class="btn primary" type="button" aria-label="播放">▶ 播放</button>
        <button id="restart" class="btn" type="button" aria-label="回到开头">⏮</button>
        <button id="clickToggle" class="btn toggle on" type="button" aria-pressed="true">节拍声 开</button>
        <button id="musicToggle" class="btn toggle on" type="button" aria-pressed="true">音乐 开</button>
      </div>

      <div class="mix">
        <label>音乐音量 <input id="musicVol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
        <label>节拍音量 <input id="clickVol" type="range" min="0" max="1" step="0.01" value="0.7"></label>
        <label>节拍音色
          <select id="sound">
            <option value="wood">木鱼</option>
            <option value="beep">电子</option>
            <option value="cowbell">牛铃</option>
          </select>
        </label>
      </div>

      <details class="fix">
        <summary>识别得不对？手动调整</summary>
        <div class="fix-grid">
          <div class="fix-row">
            <span>速度</span>
            <button class="btn small" id="half" type="button">÷2 减半</button>
            <button class="btn small" id="double" type="button">×2 加倍</button>
          </div>
          <div class="fix-row">
            <span>拍号</span>
            <select id="meterSel">
              <option value="2">2/4</option>
              <option value="3">3/4</option>
              <option value="4">4/4</option>
              <option value="6">6/8</option>
            </select>
          </div>
          <div class="fix-row">
            <span>强拍位置</span>
            <button class="btn small" id="downPrev" type="button">← 前移一拍</button>
            <button class="btn small" id="downNext" type="button">后移一拍 →</button>
          </div>
          <div class="fix-row">
            <span>节拍声偏移</span>
            <button class="btn small" id="offMinus" type="button">提前 10ms</button>
            <output id="offVal">0 ms</output>
            <button class="btn small" id="offPlus" type="button">延后 10ms</button>
          </div>
        </div>
      </details>

      <p class="keys">快捷键：空格 播放/暂停 · ← → 快退/快进 5 秒 · M 节拍声开关 · T 手动打拍</p>
    </section>

    <!-- 手动打拍 -->
    <section class="tap-panel" aria-labelledby="tapTitle">
      <div class="tap-head">
        <h2 id="tapTitle">手动打拍</h2>
        <span class="tap-hint" id="tapHint">跟着节奏点下面的按钮（或按 T 键），点 2 下以上就能算出速度</span>
      </div>
      <div class="tap-body">
        <button id="tap" class="tap-btn" type="button">点我<small>T 键</small></button>
        <div class="tap-info">
          <div class="tap-bpm">
            <input id="tapBpm" type="number" min="30" max="300" step="1" value="120" aria-label="手动速度 BPM">
            <span>BPM</span>
            <button class="btn small" id="tapMinus" type="button" aria-label="减 1 BPM">−1</button>
            <button class="btn small" id="tapPlus" type="button" aria-label="加 1 BPM">+1</button>
            <select id="tapMeter" aria-label="手动拍号">
              <option value="2">2/4</option>
              <option value="3">3/4</option>
              <option value="4" selected>4/4</option>
              <option value="6">6/8</option>
            </select>
          </div>
          <div class="dots" id="tapDots"></div>
          <div class="tap-actions">
            <button class="btn primary" id="metroToggle" type="button">▶ 开始打拍</button>
            <button class="btn" id="tapApply" type="button" hidden>用这个速度打这首歌</button>
          </div>
        </div>
      </div>
    </section>

    <footer class="foot">
      所有处理都在你的浏览器里完成，音乐不会被上传。
    </footer>
  </main>

  <script src="js/beat-detector.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
