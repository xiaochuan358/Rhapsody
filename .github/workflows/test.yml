name: 节拍器测试

on:
  push:
    paths: ['节拍器/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['节拍器/**', '.github/workflows/test.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 节拍器
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
